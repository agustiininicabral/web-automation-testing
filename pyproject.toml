[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-automation-testing"
version = "1.0.0"
description = "Selenium and pytest browser automation framework"
requires-python = ">=3.11"
dependencies = ["selenium>=4.25,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["web_automation"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
